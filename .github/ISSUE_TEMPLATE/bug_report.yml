name: Bug report
description: Something in an SDK does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste API keys, tokens, webhook secrets or personal data.** Security issues go to
        https://github.com/nafrucom/nafru-email-sdks/security/advisories/new instead.
  - type: dropdown
    id: sdk
    attributes:
      label: SDK
      options: [TypeScript / JavaScript, Python, Go, PHP, Ruby, Java, .NET, Rust, Swift]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Language / runtime and OS
      placeholder: Python 3.12 on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the error's statusCode, name and message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I use the latest version, or my version is not listed in deprecations.json.
          required: true
        - label: I removed all secrets and personal data from this report.
          required: true
